backend:
  name: github
  repo: mal9itch-smiya/site-chi-7aja
  branch: main
  base_url: https://oauth.netlifycms.org
  auth_endpoint: /auth

collections:
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    fields:
      - { label: "Name", name: "title", widget: "string" }
      - { label: "Price", name: "price", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
